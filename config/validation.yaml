future_model_changes_require_new_untouched_holdout: true
upstream_v2_holdout:
  area_id: derwent-derbyshire
  frozen_on: "2026-08-18"
  selection_inputs: [geographic contrast, catchment scale, mixed rural-urban context]
  eligibility_gate:
    minimum_complete_watershed_sites: 10
    minimum_sites_per_modelled_determinand: 10
