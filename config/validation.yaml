development_areas:
  - lune-management
  - ribble-management
external_validation_areas:
  - wyre-management
untouched_external_validation_areas:
  - thames-chilterns-south
external_evaluation_status:
  wyre-management:
    status: evaluated
    model: fixed-ridge-log1p-v1
    evaluated_on: "2026-08-18"
future_model_changes_require_new_untouched_holdout: true
minimum_development_monitored_cells: 30
minimum_external_monitored_cells: 10
