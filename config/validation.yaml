development_areas:
  - lune-management
external_validation_areas:
  - wyre-management
minimum_development_monitored_cells: 30
minimum_external_monitored_cells: 10
minimum_external_catchments: 1
rules:
  - Do not use external-validation areas to select predictors, weights, or thresholds.
  - Report performance by catchment as well as overall.
  - Keep monitoring coverage distinct from predicted environmental condition.
