merit_hydro:
  asset: MERIT/Hydro/v1_0_1
  processing_scale_metres: 90
  bands: [upa, hnd, wth, wat]
  outputs:
    - upstream_area_mean_km2
    - upstream_area_max_km2
    - height_above_drainage_mean_m
    - height_above_drainage_std_m
    - river_width_max_m
    - permanent_water_fraction
  interpretation: hydrologic context, not delineated upstream pollution load
  routing_export_bands: [dir, upa]
  site_snap_radius_pixels: 5
  routing_export_buffer_metres: 20000
hydroatlas:
  asset: WWF/HydroATLAS/v1/Basins/level12
  assignment: smallest level-12 polygon intersecting each monitoring point
  scaling_status: retain source attributes until technical-document audit
  upstream_attributes:
    - UP_AREA
    - pre_mm_uyr
    - crp_pc_use
    - pst_pc_use
    - urb_pc_use
    - for_pc_use
    - cly_pc_uav
    - ero_kh_uav
    - pop_ct_usu
    - ppd_pk_uav
    - rdd_mk_uav
