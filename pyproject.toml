[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "earth-risk-watch"
version = "0.1.0"
description = "Cloud-first environmental risk modelling for England"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
geo = [
  "duckdb>=1.1,<2",
  "geopandas>=1.0,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<24",
  "pyogrio>=0.10,<1",
  "rasterio>=1.4,<2",
  "rioxarray>=0.17,<1",
  "shapely>=2.0,<3",
  "xarray>=2024.9,<2027",
]
cloud = [
  "earthengine-api>=1.1,<2",
  "google-cloud-storage>=2.18,<4",
  "odc-stac>=0.3,<1",
  "pystac-client>=0.8,<1",
]
model = [
  "joblib>=1.4,<2",
  "scikit-learn>=1.5,<2",
]
notebook = [
  "folium>=0.18,<1",
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.2,<5",
  "matplotlib>=3.9,<4",
]
dev = [
  "earth-risk-watch[geo,model]",
  "bandit>=1.7,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]
all = ["earth-risk-watch[geo,cloud,model,notebook,dev]"]

[project.scripts]
earth-risk = "earth_risk_watch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/earth_risk_watch"]

[tool.pytest.ini_options]
addopts = "--cov=earth_risk_watch --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["earth_risk_watch"]

[[tool.mypy.overrides]]
module = ["ee", "ee.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["geopandas", "geopandas.*", "pandas", "pandas.*", "shapely", "shapely.*"]
ignore_missing_imports = true
